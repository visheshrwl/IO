apiVersion: v1
kind: Secret
metadata:
  name: postgres-17db
type: Opaque
stringData:
  POSTGRES_DB: notifications
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: postgres
  DATABASE_URL: postgres://postgres:postgres@postgres-17db:5432/notifications?sslmode=disable
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-17db-data
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-17db
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres-17db
  template:
    metadata:
      labels:
        app: postgres-17db
    spec:
      containers:
        - name: postgres
          image: postgres:17
          ports:
            - name: postgres
              containerPort: 5432
          envFrom:
            - secretRef:
                name: postgres-17db
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres", "-d", "notifications"]
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: postgres-data
          persistentVolumeClaim:
            claimName: postgres-17db-data
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-17db
spec:
  selector:
    app: postgres-17db
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
