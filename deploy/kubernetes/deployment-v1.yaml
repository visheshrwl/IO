apiVersion: apps/v1
kind: Deployment
metadata:
  name: io-service-v1
spec:
  replicas: 2
  selector:
    matchLabels:
      app: io-service
      version: v1
  template:
    metadata:
      labels:
        app: io-service
        version: v1
    spec:
      containers:
        - name: io-service
          image: io-v1:local-20260828
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: PORT
              value: "8080"
            - name: APP_VERSION
              value: "v1"
            - name: PEER_URL
              value: "http://pong-service"
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
