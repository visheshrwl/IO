apiVersion: apps/v1
kind: Deployment
metadata:
  name: pong-service-v2
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pong-service
      version: v2
  template:
    metadata:
      labels:
        app: pong-service
        version: v2
    spec:
      containers:
        - name: pong-service
          image: pong-service-v2:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: PORT
              value: "8080"
            - name: APP_VERSION
              value: "v2"
            - name: PEER_URL
              value: "http://io-service"
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10