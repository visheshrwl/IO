services:
  io:
    build:
      context: .
      args:
        SERVICE: io
    ports:
      - "8080:8080"
    environment:
      APP_VERSION: v1
      PEER_URL: http://pong-service:8080

  pong-service:
    build:
      context: .
      args:
        SERVICE: pong-service
    ports:
      - "8091:8080"
    environment:
      APP_VERSION: v1
      PEER_URL: http://io:8080
